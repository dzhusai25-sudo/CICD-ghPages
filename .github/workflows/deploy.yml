name: Deploy to Guthub Pages

on:
  pull_request:

jobs:
  deploy:
    permissions:
      contents: write
    runa-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
        node-version: '24.x' # Or your desired Node.js version
      - run: npm install
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.github_token }}
          publish-dir: ./dist
